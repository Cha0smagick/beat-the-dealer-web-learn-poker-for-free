<script>
(function () {
  try {
    if (sessionStorage.getItem("btd404")) return; // second bounce: stop, show the link
    sessionStorage.setItem("btd404", "1");
    var seg = location.pathname.split("/").filter(Boolean);
    // project site (/repo/...) → repo root; user site (/page) → origin root
    var base = seg.length >= 2 ? "/" + seg[0] + "/" : "/";
    location.replace(base + "#/");
  } catch (e) { /* stay on the styled page */ }
})();
</script>
